name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci

      # The pre-existing lint backlog has been cleared, so lint now blocks the build.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # A dummy value is enough — build only needs it to be a well-formed
          # URL, it never actually calls the API at build time.
          NUXT_PUBLIC_API_BASE_URL: http://localhost:5000/api
