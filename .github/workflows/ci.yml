name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci

      # continue-on-error, not removed: the codebase currently has ~308
      # pre-existing lint errors (mostly `no-explicit-any` / unused-vars)
      # from before ESLint was ever wired up here. Blocking CI on all of
      # those on day one just makes CI red forever and trains everyone to
      # ignore it. Lint still runs and is visible (⚠ on this step) so
      # regressions are seen — it just doesn't fail the build until that
      # backlog is paid down. Remove continue-on-error once `npm run lint`
      # is clean.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # A dummy value is enough — build only needs it to be a well-formed
          # URL, it never actually calls the API at build time.
          NUXT_PUBLIC_API_BASE_URL: http://localhost:5000/api
